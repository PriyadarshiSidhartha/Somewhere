                    }, { fadeInDuration: 300, fadeOutDuration: 400 });
                }
            });

            // --- Other players already in world ---
            socket.on('players_state', (data) => {
                for (const p of data.players) {
                    addRemotePlayer(p);
                }
                updateHudPlayers();
            });

            // --- Someone joins ---
            socket.on('player_joined', (player) => {
                addRemotePlayer(player);
                updateHudPlayers();
            });

            // --- Someone leaves ---
            socket.on('player_left', (data) => {
                removeRemotePlayer(data.playerId);
                updateHudPlayers();
            });

            // --- Movement snapshots (server-authoritative physics) ---
            socket.on('movement_snapshot', (data) => {
                for (const update of data.players) {
                    if (update.id === mySocketId) {
                        // While player is in death/respawn transition, ignore in-flight void snapshots
                        if (isRespawning) continue;

                        // --- SERVER RECONCILIATION ---
                        // 1. Store the authoritative state.
                        serverState.position.x = update.position.x;
                        serverState.position.y = update.position.y;
                        serverState.position.z = update.position.z;
                        serverState.velocity.x = update.velocity.x;
                        serverState.velocity.y = update.velocity.y;
                        serverState.velocity.z = update.velocity.z;
                        serverState.grounded = update.grounded;

                        // 2. Record the old predicted position for smooth correction.
                        const oldPredX = predictedState.position.x;
                        const oldPredY = predictedState.position.y;
                        const oldPredZ = predictedState.position.z;

                        // 3. Start from authoritative state.
                        predictedState = clonePhysicsState(serverState);
                        lastAckedSeq = update.lastProcessedSeq;

                        // 4. Discard acknowledged inputs, replay unacknowledged ones.
                        while (inputHistory.length > 0 && inputHistory[0].seq <= lastAckedSeq) {
                            inputHistory.shift();
                        }

                        // 5. Replay remaining inputs to reconstruct predicted state.
                        let replayTime = clientSimTime - inputHistory.length * PHYSICS_DT;
                        for (const inp of inputHistory) {
                            replayTime += PHYSICS_DT;
                            physicsStep(predictedState, inp, clientIsSolidAt, PC, PHYSICS_DT, replayTime);
                        }

                        // 6. Compute visual correction offset (smooth, don't snap).
                        const newPredX = predictedState.position.x;
                        const newPredY = predictedState.position.y;
                        const newPredZ = predictedState.position.z;

                        // Add the difference between old and new prediction to smooth offset.
                        smoothOffsetX += oldPredX - newPredX;
                        smoothOffsetY += oldPredY - newPredY;
                        smoothOffsetZ += oldPredZ - newPredZ;

                        prevPhysPos.x = predictedState.position.x;
                        prevPhysPos.y = predictedState.position.y;
                        prevPhysPos.z = predictedState.position.z;

                        // If correction is very large, snap immediately.
                        const corrDist = Math.hypot(smoothOffsetX, smoothOffsetY, smoothOffsetZ);
                        if (corrDist > 5) {
                            smoothOffsetX = 0;
                            smoothOffsetY = 0;
                            smoothOffsetZ = 0;
                        }
                    } else {
                        const remote = remotePlayers.get(update.id);
                        if (remote) {
                            // Store raw capsule center position for interpolation.
                            remote.targetPos.x = update.position.x;
                            remote.targetPos.y = update.position.y;
                            remote.targetPos.z = update.position.z;
                            if (typeof update.yaw === 'number') {
                                remote.targetYaw = update.yaw;
                            }
                        }
                    }
                }
            });

            // --- Block events ---
            socket.on('block:placed', (data) => {
                addBlock(data.x, data.y, data.z, data.type);
            });

            socket.on('block:removed', (data) => {
                deleteBlock(data.x, data.y, data.z);
            });

            // --- Rejected actions ---
            socket.on('request_rejected', (data) => {
                console.warn(`[Rejected] ${data.action}: ${data.reason}`);
            });

            // --- Chat (floating text from other players) ---
            socket.on('chat:message', (data) => {
                if (data.playerId === mySocketId) return; // we already show our own
                const remote = remotePlayers.get(data.playerId);
                if (!remote) return;
                // Create a floating released chat sprite at the remote player's head.
                createReleasedChatSprite(
                    data.message,
                    remote.mesh.position.x,
                    remote.mesh.position.y + 1.3,
                    remote.mesh.position.z
                );
            });

            // ================================================================
            // MOVEMENT INPUT + CLIENT-SIDE PREDICTION
            // ================================================================

            // Access the shared physics engine loaded via <script>.
            const { PHYSICS_CONFIG: PC, PHYSICS_DT, physicsStep,
                createPhysicsState, clonePhysicsState } = window.Physics;

            const keys = { w: false, a: false, s: false, d: false };
            let jumpPressed = false;

            // --- Client prediction state ---
            // The authoritative state received from the server.
            let serverState = createPhysicsState(
                user.position.x, user.position.y, user.position.z
            );
            // The predicted state used for rendering.
            let predictedState = clonePhysicsState(serverState);
            // Input history for reconciliation (ring buffer of recent inputs).
            const inputHistory = [];
            const MAX_INPUT_HISTORY = 300; // ~5 seconds at 60 inputs/sec
            let inputSeq = 0;
            let lastAckedSeq = -1;
            // Client-side simulation time (tracks physics sub-steps).
            let clientSimTime = 0;
            // Visual smoothing offset (for smooth corrections without snapping).
            let smoothOffsetX = 0, smoothOffsetY = 0, smoothOffsetZ = 0;
            const SMOOTH_RATE = 12; // how fast visual catches up (per second)

            // ---- CHAT MODE ----
            // When chatMode is true, all alphabet/gameplay keys are disabled.
            let chatMode = false;
            let chatText = '';

            const chatHintEl = document.getElementById('chat-hint');
            const chatGradientEl = document.getElementById('chat-gradient-overlay');

            function setChatMode(active) {
                chatMode = active;
                if (chatHintEl) {
                    chatHintEl.textContent = active ? '. . .' : 'Press Enter to chat';
                    if (active) {
                        chatHintEl.classList.add('in-chat');
                    } else {
                        chatHintEl.classList.remove('in-chat');
                    }
                }
                if (chatGradientEl) {
                    if (active) {
                        chatGradientEl.classList.add('visible');
                    } else {
                        chatGradientEl.classList.remove('visible');
                    }
                }
            }

            window.addEventListener('keydown', (e) => {
                // --- CHAT MODE INPUT ---
                if (chatMode) {
                    e.preventDefault();
                    if (e.key === 'Escape') {
                        // Cancel chat.
                        chatText = '';
                        setChatMode(false);
                        updateLocalChatSprite();
                        return;
                    }
                    if (e.key === 'Enter') {
                        // Release the chat message.
                        releaseChat();
                        return;
                    }
                    if (e.key === 'Backspace') {
                        chatText = chatText.slice(0, -1);
                        updateLocalChatSprite();
                        // Send typing update to server for real-time display.
                        socket.emit('chat:typing', { text: chatText });
                        return;
                    }
                    // Only accept printable single characters.
                    if (e.key.length === 1) {
                        if (chatText.length < CHAT_MAX_LENGTH) {
                            chatText += e.key;
                            updateLocalChatSprite();
                            socket.emit('chat:typing', { text: chatText });
                        }
                        // Auto-release if at max length (stay in chat mode).
                        if (chatText.length >= CHAT_MAX_LENGTH) {
                            releaseChat(false);
                        }
                    }
                    return; // Block everything else while chatting.
                }

                // --- NORMAL GAMEPLAY / UI INPUT ---
                // If an input is focused, don't intercept keys for gameplay
                const isTyping = document.activeElement && (
                    document.activeElement.tagName === 'INPUT' ||
                    document.activeElement.tagName === 'TEXTAREA'
                );
                if (isTyping) {
                    return;
                }

                // Press "Tab" to focus block search input (discovery system)
                if (e.key === 'Tab' && !chatMode) {
                    e.preventDefault();
                    blockSearchInput.focus();
                    return;
                }

                // Number shortcuts 1-9 and 0 to select from visible block slots
                if (!chatMode && ((e.key >= '1' && e.key <= '9') || e.key === '0')) {
                    const slotIndex = e.key === '0' ? 9 : parseInt(e.key, 10) - 1;
                    selectSlotByIndex(slotIndex);
                    e.preventDefault();
                    return;
                }

                // Enter chat mode with "Enter" key.
                if (e.key === 'Enter') {
                    e.preventDefault();
                    setChatMode(true);
                    chatText = '';
                    // Clear any held movement keys so the player decelerates
                    // naturally through the existing movement logic.
                    keys.w = false; keys.a = false; keys.s = false; keys.d = false;
                    // Immediately send zero input to the server so it also
                    // stops accelerating this player.
                    sendMovementInput();
                    updateLocalChatSprite();
                    return;
                }

                const k = e.key.toLowerCase();
                if (k in keys) { keys[k] = true; e.preventDefault(); }
                if (e.code === 'Space') { jumpPressed = true; e.preventDefault(); }
            });

            window.addEventListener('keyup', (e) => {
                const isTyping = document.activeElement && (
                    document.activeElement.tagName === 'INPUT' ||
                    document.activeElement.tagName === 'TEXTAREA'
                );
                if (chatMode || isTyping) return; // ignore key-ups during typing
                const k = e.key.toLowerCase();
                if (k in keys) keys[k] = false;
                if (e.code === 'Space') jumpPressed = false;
            });

            function getCameraYaw() {
                return cameraYaw;
            }

            function sendMovementInput() {
                if (!socket.connected) return;

                const forward = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
                const strafe = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
                const yaw = getCameraYaw();
                const jump = jumpPressed;
                const seq = inputSeq++;

                const inputPacket = { forward, strafe, yaw, jump, seq };

                // Store in history for reconciliation replay.
                inputHistory.push(inputPacket);
                if (inputHistory.length > MAX_INPUT_HISTORY) {
                    inputHistory.shift();
                }

                socket.emit('movement_input', inputPacket);
            }

            // Send movement input at the physics tick rate for determinism.
            setInterval(sendMovementInput, 1000 / PC.physicsTickRate);

            // ================================================================
            // FLOATING CHAT SYSTEM (THREE.JS SPRITES)
            // ================================================================

            // Local player's typing sprite (visible while typing).
            let localChatSprite = null;

            // Array of released (floating-up, fading) chat sprites.
            const releasedChatSprites = [];

            // Rotate a local-space (right, up, forward) offset by a yaw angle
            // into world-space coordinates.  This keeps the text anchored to
            // the player's right/front side regardless of facing direction.
            //
            // Three.js convention (rotation.y = 0 → faces -Z):
            //   Right   = ( cosY, 0, -sinY)
            //   Forward = (-sinY, 0, -cosY)
            function chatWorldOffset(rightOff, upOff, fwdOff, yaw) {
                const sinY = Math.sin(yaw);
                const cosY = Math.cos(yaw);
                return {
                    x: cosY * rightOff + (-sinY) * fwdOff,
                    y: upOff,
                    z: -sinY * rightOff + (-cosY) * fwdOff,
                };
            }

            // Helper to safely apply chat font to 2D canvas context.
            // Automatically fixes syntax issues, unclosed quotes, and falls back to
            // regular weight or system fonts to guarantee canvas text never collapses to 10px default.
            function applyCanvasFont(ctx, fontSize) {
                const weight = (typeof CHAT_FONT_WEIGHT !== 'undefined' && CHAT_FONT_WEIGHT) ? CHAT_FONT_WEIGHT : 'normal';
                let family = (typeof CHAT_FONT_FAMILY !== 'undefined' && CHAT_FONT_FAMILY) ? CHAT_FONT_FAMILY.trim() : "'Segoe UI', sans-serif";

                // Fix unclosed single quotes if any exist (e.g. 'Roboto without closing quote)
                const singleQuotes = (family.match(/'/g) || []).length;
                if (singleQuotes % 2 !== 0) family += "'";
                const doubleQuotes = (family.match(/"/g) || []).length;
                if (doubleQuotes % 2 !== 0) family += '"';

                // 1. Attempt with specified weight + fontSize + family
                ctx.font = `${weight} ${fontSize}px ${family}`;

                // 2. If browser canvas rejected declaration (keeps 10px default), try without weight
                if (!ctx.font || ctx.font.startsWith('10px')) {
                    ctx.font = `${fontSize}px ${family}`;
                }
                // 3. If still invalid, use safe system font at exact requested fontSize
                if (!ctx.font || ctx.font.startsWith('10px')) {
                    ctx.font = `bold ${fontSize}px 'Segoe UI', -apple-system, sans-serif`;
                }
            }

            // Creates an outlined text sprite with word wrapping.
            // Uses the CHAT_* config constants for sizing.
            function createTextSprite(text, maxWidth) {
                const cnv = document.createElement('canvas');
                const ctx = cnv.getContext('2d');
                const fontSize = CHAT_FONT_SIZE;
                const lineHeight = fontSize * CHAT_LINE_HEIGHT;
                const padding = 16;
                const maxCanvasWidth = maxWidth || CHAT_WRAP_WIDTH;

                applyCanvasFont(ctx, fontSize);

                const maxTextWidth = maxCanvasWidth - padding * 2;

                // Break a single word that's too wide by inserting hyphens.
                function breakLongWord(word) {
                    const parts = [];
                    while (ctx.measureText(word).width > maxTextWidth) {
                        // Find how many chars fit with a trailing '-'.
                        let cut = word.length;
                        while (cut > 1 && ctx.measureText(word.slice(0, cut) + '-').width > maxTextWidth) {
                            cut--;
                        }
                        parts.push(word.slice(0, cut) + '-');
                        word = word.slice(cut);
                    }
                    if (word) parts.push(word);
                    return parts;
                }

                // Word-wrap the text, breaking long words with hyphens.
                const words = (text || ' ').split(' ');
                const lines = [];
                let currentLine = '';

                for (const word of words) {
                    // If the single word is wider than the max, break it.
                    const wordParts = ctx.measureText(word).width > maxTextWidth
                        ? breakLongWord(word)
                        : [word];

                    for (const part of wordParts) {
                        const testLine = currentLine ? currentLine + ' ' + part : part;
                        if (ctx.measureText(testLine).width > maxTextWidth && currentLine) {
                            lines.push(currentLine);
                            currentLine = part;
                        } else {
                            currentLine = testLine;
                        }
                    }
                }
                if (currentLine) lines.push(currentLine);
                if (lines.length === 0) lines.push(' ');

                // Find the widest line to size the canvas.
                let widestLine = 0;
                for (const line of lines) {
                    const w = ctx.measureText(line).width;
                    if (w > widestLine) widestLine = w;
                }

                cnv.width = Math.min(widestLine + padding * 2, maxCanvasWidth);
                cnv.height = lineHeight * lines.length + padding * 2;

                // Re-set font after canvas resize.
                applyCanvasFont(ctx, fontSize);
                ctx.textBaseline = 'middle';
                ctx.textAlign = 'center';
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';

                const cx = cnv.width / 2;

                // Draw each line with smooth rounded outline stroke (eliminating miter spikes).
                for (let i = 0; i < lines.length; i++) {
                    const cy = padding + lineHeight * (i + 0.5);
                    ctx.lineWidth = CHAT_OUTLINE_WIDTH;
                    ctx.strokeStyle = '#000000';
                    ctx.strokeText(lines[i], cx, cy);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(lines[i], cx, cy);
                }

                const texture = new THREE.CanvasTexture(cnv);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.generateMipmaps = false;
                texture.needsUpdate = true;

                const spriteMat = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    depthTest: false,
                });
                const sprite = new THREE.Sprite(spriteMat);

                // Anchor at bottom-center so text grows upward from the offset point.
                sprite.center.set(0.5, 0);

                // Scale to reasonable world size.
                const aspect = cnv.width / cnv.height;
                const height = CHAT_SPRITE_HEIGHT * lines.length;
                sprite.scale.set(height * aspect, height, 1);

                return sprite;
            }

            function updateLocalChatSprite() {
                // Remove old sprite.
                if (localChatSprite) {
                    scene.remove(localChatSprite);
                    localChatSprite.material.map.dispose();
                    localChatSprite.material.dispose();
                    localChatSprite = null;
                }

                if (!chatMode || chatText.length === 0) return;

                localChatSprite = createTextSprite(chatText, CHAT_WRAP_WIDTH);
                scene.add(localChatSprite);
                // Position will be updated each frame in animate().
            }

            // Refresh live chat sprite when web fonts finish downloading
            if (document.fonts) {
                document.fonts.ready.then(() => {
                    if (localChatSprite) updateLocalChatSprite();
                });
            }

            function createReleasedChatSprite(text, worldX, worldY, worldZ) {
                if (!text || text.trim().length === 0) return;
                const sprite = createTextSprite(text, CHAT_WRAP_WIDTH);
                sprite.position.set(worldX, worldY, worldZ);
                scene.add(sprite);
                releasedChatSprites.push({
                    sprite,
                    age: 0,
                    maxAge: CHAT_FADE_DURATION,
                    floatSpeed: CHAT_FLOAT_SPEED,
                });
            }

            function releaseChat(exitChatMode = true) {
                if (chatText.trim().length > 0) {
                    // Send chat message to server.
                    socket.emit('chat:message', { message: chatText.trim() });

                    // Release from the player's current position using the
                    // same yaw-rotated offset the animate loop uses, so there
                    // is zero positional jump.
                    const off = chatWorldOffset(CHAT_OFFSET_X, CHAT_OFFSET_Y, CHAT_OFFSET_Z, cameraYaw);
                    const releaseX = localPos.x + off.x;
                    const releaseY = localPos.y + off.y;
                    const releaseZ = localPos.z + off.z;

                    createReleasedChatSprite(chatText.trim(), releaseX, releaseY, releaseZ);
                }
                chatText = '';
                if (exitChatMode) setChatMode(false);
                // Remove typing sprite.
                if (localChatSprite) {
                    scene.remove(localChatSprite);
                    localChatSprite.material.map.dispose();
                    localChatSprite.material.dispose();
                    localChatSprite = null;
                }
            }

            // Handle real-time typing from remote players.
            socket.on('chat:typing', (data) => {
                const remote = remotePlayers.get(data.playerId);
                if (!remote) return;
                // Remove old typing sprite.
                if (remote.chatSprite) {
                    scene.remove(remote.chatSprite);
                    remote.chatSprite.material.map.dispose();
                    remote.chatSprite.material.dispose();
                    remote.chatSprite = null;
                }
                if (data.text && data.text.length > 0) {
                    remote.chatSprite = createTextSprite(data.text, CHAT_WRAP_WIDTH);
                    // Initial position (updated each frame in animate loop).
                    const rYaw = remote.targetYaw || 0;
                    const rOff = chatWorldOffset(CHAT_REMOTE_OFFSET_X, CHAT_REMOTE_OFFSET_Y, CHAT_REMOTE_OFFSET_Z, rYaw);
                    remote.chatSprite.position.set(
                        remote.mesh.position.x + rOff.x,
                        remote.mesh.position.y + rOff.y,
                        remote.mesh.position.z + rOff.z
                    );
                    scene.add(remote.chatSprite);
                }
            });

            // ================================================================
            // BLOCK DISCOVERY & SELECTION SYSTEM
            // ================================================================

            const blockMap = new Map();
            for (const b of blockCatalog) {
                blockMap.set(b.id, b);
            }

            function getCatalogBlock(id) {
                if (!id) return null;
                return blockMap.get(id) || (id === 'wood' ? blockMap.get('wood_planks') : null);
            }

            // Player's 10 recently selected blocks (persisted in MongoDB user profile)
            let recentBlocks = [];
            if (user.recentBlocks && Array.isArray(user.recentBlocks) && user.recentBlocks.length > 0) {
                recentBlocks = user.recentBlocks.filter(id => blockMap.has(id));
            }
            if (recentBlocks.length < 10) {
                for (const defId of defaultRecent) {
                    if (!recentBlocks.includes(defId) && blockMap.has(defId)) {
                        recentBlocks.push(defId);
                    }
                    if (recentBlocks.length >= 10) break;
                }
            }

            function loadRecentBlocksFromServer(serverRecent) {
                if (!Array.isArray(serverRecent)) return;
                const valid = serverRecent.filter(id => blockMap.has(id));
                if (valid.length > 0) {
                    recentBlocks = valid;
                    if (!recentBlocks.includes(selectedBlockId)) {
                        selectedBlockId = recentBlocks[0];
                    }
                    renderSlots();
                }
            }

            let selectedBlockId = recentBlocks[0] || 'dirt';
            let currentSearchQuery = '';

            const blockPanel = document.getElementById('block-panel');
            const blockSearchInput = document.getElementById('block-search-input');
            const blockSlotsContainer = document.getElementById('block-slots');

            let currentSlots = []; // Currently displayed 10 slots (either search results or recent blocks)

            function updateRecentBlocks(blockId) {
                const idx = recentBlocks.indexOf(blockId);
                if (idx !== -1) {
                    recentBlocks.splice(idx, 1);
                }
                recentBlocks.unshift(blockId);
                if (recentBlocks.length > 10) {
                    recentBlocks = recentBlocks.slice(0, 10);
                }

                // Persist recent blocks to server (MongoDB profile)
                if (socket.connected) {
                    socket.emit('player:recent_blocks', { recentBlocks });
                }
            }

            function selectBlock(blockId) {
                if (!blockMap.has(blockId)) return;
                selectedBlockId = blockId;
                updateRecentBlocks(blockId);
                renderSlots();
            }

            function selectSlotByIndex(index) {
                if (index < 0 || index >= currentSlots.length) return;
                const block = currentSlots[index];
                if (block) {
                    selectBlock(block.id);
                }
            }

            function getActiveSlots() {
                if (currentSearchQuery === '') {
                    return recentBlocks.map(id => getCatalogBlock(id)).filter(Boolean);
                }
                const q = currentSearchQuery.toLowerCase();
                const matches = blockCatalog.filter(b =>
                    b.name.toLowerCase().includes(q) || b.id.toLowerCase().includes(q)
                );
                return matches.slice(0, 10);
            }

            function renderSlots() {
                currentSlots = getActiveSlots();
                blockSlotsContainer.innerHTML = '';

                for (let i = 0; i < 10; i++) {
                    const block = currentSlots[i] || null;
                    const keyLabel = (i + 1) % 10; // 1 to 9, then 0 for slot 10

                    const slotEl = document.createElement('div');
                    slotEl.className = 'block-slot' + (block ? '' : ' empty');
                    if (block && block.id === selectedBlockId) {
                        slotEl.classList.add('active');
                    }

                    const keyEl = document.createElement('span');
                    keyEl.className = 'slot-key';
                    keyEl.textContent = keyLabel;
                    slotEl.appendChild(keyEl);

                    if (block) {
                        const swatchEl = document.createElement('span');
                        swatchEl.className = 'slot-swatch';
                        swatchEl.style.backgroundColor = block.hex;
                        slotEl.appendChild(swatchEl);

                        const nameEl = document.createElement('span');
                        nameEl.className = 'slot-name';
                        nameEl.textContent = block.name;
                        slotEl.appendChild(nameEl);

                        slotEl.title = `${block.name} (Key: ${keyLabel})`;

                        slotEl.addEventListener('click', (e) => {
                            e.stopPropagation();
                            selectBlock(block.id);
                        });
                    } else {
                        const emptyNameEl = document.createElement('span');
                        emptyNameEl.className = 'slot-name';
                        emptyNameEl.style.opacity = '0.4';
                        emptyNameEl.textContent = currentSearchQuery ? 'No match' : 'Empty';
                        slotEl.appendChild(emptyNameEl);
                    }

                    blockSlotsContainer.appendChild(slotEl);
                }
            }

            // Search input live filtering
            blockSearchInput.addEventListener('input', () => {
                currentSearchQuery = blockSearchInput.value.trim();
                renderSlots();
            });

            // Enter auto-selects top result (if present) and exits search input mode; Escape or Tab blurs
            blockSearchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (currentSlots.length > 0 && currentSlots[0]) {
                        selectBlock(currentSlots[0].id);
                    }
                    blockSearchInput.blur();
                } else if (e.key === 'Escape' || e.key === 'Tab') {
                    e.preventDefault();
                    blockSearchInput.blur();
                }
            });

            // Initial slot rendering
            renderSlots();

            // ================================================================
            // BLOCK INTERACTION (RAYCASTING, PLACEMENT & REMOVAL)
            // ================================================================

            // In 3rd person, the camera is ~4.5 units behind the player.
            // raycaster.far = 30 ensures rays from the camera reach the world in front,
            // while PLAYER_REACH ensures blocks are only placed/removed within 7.5 units of the character.
            const raycaster = new THREE.Raycaster();
            raycaster.far = 30;
            const PLAYER_REACH = 7.5; // Max interaction distance from player
            const PLAYER_INTERACTION_RANGE = 7.5; // Max distance from player to target another player; tune here.

            // Highlight box that displays a clean, bright white outer silhouette
            // around the currently targeted block.
            // Uses EdgesGeometry to extract only the 12 outer box edges (eliminating all diagonal face/triangle lines)
            // with solid bright white color and depth testing so back edges inside the block stay hidden.
            const highlightGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.004, 1.004, 1.004));
            const highlightMat = new THREE.LineBasicMaterial({
                color: 0xffffff,
                transparent: false,
                depthTest: true,
                depthWrite: false,
            });
            const highlightBox = new THREE.LineSegments(highlightGeo, highlightMat);
            highlightBox.renderOrder = 10;
            highlightBox.visible = false;
            scene.add(highlightBox);

            const playerHighlightGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(0.66, 1.86, 0.66));
            const playerHighlightMat = new THREE.LineBasicMaterial({
                color: 0x7ecfff,
                depthTest: true,
                depthWrite: false,
            });
            const playerHighlight = new THREE.LineSegments(playerHighlightGeo, playerHighlightMat);
            playerHighlight.renderOrder = 11;
            playerHighlight.visible = false;
            scene.add(playerHighlight);

            // Cast a ray from crosshair (center of screen) and find the closest reachable block.
            function getTargetBlock() {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

                const meshArray = Array.from(blockMeshes.values());
                const intersects = raycaster.intersectObjects(meshArray);

                for (const hit of intersects) {
                    // Check reach distance from player's body, not from the camera
                    const distFromPlayer = Math.hypot(
                        hit.point.x - localPos.x,
                        hit.point.y - localPos.y,
                        hit.point.z - localPos.z
                    );
                    if (distFromPlayer <= PLAYER_REACH) {
                        return hit;
                    }
                }

                return null;
            }

            function getTargetPlayer() {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const playerMeshes = Array.from(remotePlayers.values(), (player) => player.mesh);
                const intersects = raycaster.intersectObjects(playerMeshes);
                for (const hit of intersects) {
                    const distFromPlayer = Math.hypot(
                        hit.point.x - localPos.x,
                        hit.point.y - localPos.y,
                        hit.point.z - localPos.z
                    );
                    if (distFromPlayer <= PLAYER_INTERACTION_RANGE) {
                        const player = remotePlayers.get(hit.object.userData.socketId);
                        if (player) return { socketId: hit.object.userData.socketId, player, hit };
                    }
                }
                return null;
            }

            // Left-click (button 0): remove block
            // Right-click (button 2): place block
            document.addEventListener('mousedown', (e) => {
                const isTyping = document.activeElement && (
                    document.activeElement.tagName === 'INPUT' ||
                    document.activeElement.tagName === 'TEXTAREA'
                );
                if (!pointerLocked || chatMode || isTyping) return;

                if (e.button === 0) {
                    const targetPlayer = getTargetPlayer();
                    const targetBlock = getTargetBlock();
                    if (targetPlayer && (!targetBlock || targetPlayer.hit.distance < targetBlock.distance)) {
                        e.preventDefault();
                        window.playerProfileIsOpening = true;
                        window.openPlayerProfile(targetPlayer.socketId);
                        if (document.pointerLockElement) document.exitPointerLock();
                        return;
                    }
                    // Left-click: remove the block you're looking at
                    const hit = getTargetBlock();
                    if (!hit) return;

                    const { x, y, z } = hit.object.userData;
                    socket.emit('block:remove', { x, y, z });
                    // Optimistic local removal
                    deleteBlock(x, y, z);
                } else if (e.button === 2) {
                    // Right-click: place a block adjacent to the targeted face
                    const hit = getTargetBlock();
                    if (!hit || !hit.face) return;

                    const normal = hit.face.normal.clone();
                    normal.transformDirection(hit.object.matrixWorld);

                    const { x, y, z } = hit.object.userData;
                    const nx = Math.round(x + normal.x);
                    const ny = Math.round(y + normal.y);
                    const nz = Math.round(z + normal.z);

                    // Don't place a block inside the player character
                    const _hh = window.Physics.capsuleHalfHeight(window.Physics.PHYSICS_CONFIG);
                    const _r = window.Physics.PHYSICS_CONFIG.capsuleRadius;
                    const feetY = localPos.y - _hh;
                    const headY = localPos.y + _hh;
                    if (Math.abs(localPos.x - nx) < (0.5 + _r) &&
                        Math.abs(localPos.z - nz) < (0.5 + _r) &&
                        ny >= Math.floor(feetY) && ny <= Math.ceil(headY)) {
                        return;
                    }

                    const blockType = selectedBlockId || 'dirt';
                    socket.emit('block:place', { x: nx, y: ny, z: nz, type: blockType });
                    // Optimistic local add
                    addBlock(nx, ny, nz, blockType);
                }
            });

            // Prevent native browser context menu from triggering on right click
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });

            // ================================================================
            // RENDER LOOP (with client-side physics prediction)
            // ================================================================

            const clock = new THREE.Clock();
            const capsuleHH = window.Physics.capsuleHalfHeight(PC);

            // localPos is derived from predictedState + smoothing offset.
            // It's the position used for rendering (camera, mesh, chat sprites).
            // This is the capsule CENTER, same as the physics position.
            const localPos = {
                x: user.position.x,
                y: user.position.y,
                z: user.position.z,
            };

            // Previous physics position for sub-frame display interpolation (eliminates 60Hz vs 120Hz judder/ghosting)
            const prevPhysPos = {
                x: user.position.x,
                y: user.position.y,
                z: user.position.z,
            };

            // Client-side physics accumulator for frame-rate-independent stepping.
            let clientAccumulator = 0;

            // ================================================================
            // PLAYER DEATH & RESPAWN
            // ================================================================

            let isRespawning = false;

            async function handlePlayerDeath() {
                if (isRespawning) return;
                isRespawning = true;

                // Close chat mode if currently typing
                setChatMode(false);
                chatText = '';
                updateLocalChatSprite();

                try {
                    await ScreenTransition.executeTransition(async () => {
                        // 1. Tell server to respawn player
                        if (socket && socket.connected) {
                            socket.emit('player:respawn');
                        }

                        // 2. Reset client player state to spawn
                        const spawnX = 0;
                        const spawnY = (typeof WORLD_CONFIG !== 'undefined' && WORLD_CONFIG.defaultY) ? WORLD_CONFIG.defaultY : 5;
                        const spawnZ = 0;

                        predictedState.position.x = spawnX;
                        predictedState.position.y = spawnY;
                        predictedState.position.z = spawnZ;
                        predictedState.velocity.x = 0;
                        predictedState.velocity.y = 0;
                        predictedState.velocity.z = 0;
                        predictedState.grounded = false;

                        serverState.position.x = spawnX;
                        serverState.position.y = spawnY;
                        serverState.position.z = spawnZ;
                        serverState.velocity.x = 0;
                        serverState.velocity.y = 0;
                        serverState.velocity.z = 0;
                        serverState.grounded = false;

                        prevPhysPos.x = spawnX;
                        prevPhysPos.y = spawnY;
                        prevPhysPos.z = spawnZ;

                        localPos.x = spawnX;
                        localPos.y = spawnY;
                        localPos.z = spawnZ;

                        smoothOffsetX = 0;
                        smoothOffsetY = 0;
                        smoothOffsetZ = 0;
                        inputHistory.length = 0;
                        keys.w = keys.a = keys.s = keys.d = false;
                        jumpPressed = false;

                        if (localPlayerMesh) {
                            localPlayerMesh.position.set(spawnX, spawnY, spawnZ);
                        }

                        // Reset camera follow pivot so camera snaps cleanly to spawn without jarring lerp
                        currentPivotX = null;
                        currentPivotY = null;
                        currentPivotZ = null;
                        swayOffsetX = 0;

                        // Wait for server respawn confirmation and 2 render frames so scene is settled
                        await new Promise((resolve) => {
                            let confirmed = false;
                            const finish = () => {
                                if (confirmed) return;
                                confirmed = true;
                                socket.off('player:respawn_confirmed', finish);
                                requestAnimationFrame(() => {
                                    requestAnimationFrame(resolve);
                                });
                            };

                            if (socket && socket.connected) {
                                socket.once('player:respawn_confirmed', finish);
                                setTimeout(finish, 400);
                            } else {
                                requestAnimationFrame(() => {
                                    requestAnimationFrame(resolve);
                                });
                            }
                        });
                    }, {
                        fadeInDuration: 300,
                        fadeOutDuration: 400,
                        holdDelay: 100,
                    });
                } catch (err) {
                    console.error('[Respawn] Error during respawn transition:', err);
                } finally {
                    isRespawning = false;
                }
            }

            window.respawnPlayer = handlePlayerDeath;

            function animate() {
                requestAnimationFrame(animate);

                const dt = clock.getDelta();

                // --- CLIENT-SIDE PHYSICS PREDICTION ---
                // Run the same physics step locally so movement feels instant.
                // This runs at a fixed timestep, independent of frame rate.
                clientAccumulator += dt;
                if (clientAccumulator > 0.25) clientAccumulator = 0.25; // cap spiral of death

                while (clientAccumulator >= PHYSICS_DT) {
                    if (isRespawning) {
                        clientAccumulator = 0;
                        break;
                    }

                    prevPhysPos.x = predictedState.position.x;
                    prevPhysPos.y = predictedState.position.y;
                    prevPhysPos.z = predictedState.position.z;

                    clientAccumulator -= PHYSICS_DT;
                    clientSimTime += PHYSICS_DT;

                    // Build the current input from key state.
                    const currentInput = {
                        forward: (keys.w ? 1 : 0) - (keys.s ? 1 : 0),
                        strafe: (keys.d ? 1 : 0) - (keys.a ? 1 : 0),
                        yaw: cameraYaw,
                        jump: jumpPressed,
                    };

                    physicsStep(predictedState, currentInput, clientIsSolidAt,
                        PC, PHYSICS_DT, clientSimTime);
                }

                // --- DEATH / VOID FALL DETECTION ---
                if (predictedState && predictedState.position.y <= -8 && !isRespawning) {
                    handlePlayerDeath();
                }

                // Sub-frame alpha interpolation for high refresh rate monitors (120Hz/144Hz/ProMotion)
                const alpha = Math.min(1, Math.max(0, clientAccumulator / PHYSICS_DT));
                const interpX = prevPhysPos.x + (predictedState.position.x - prevPhysPos.x) * alpha;
                const interpY = prevPhysPos.y + (predictedState.position.y - prevPhysPos.y) * alpha;
                const interpZ = prevPhysPos.z + (predictedState.position.z - prevPhysPos.z) * alpha;

                // --- SMOOTH VISUAL CORRECTION ---
                // Decay the smoothing offset so visual catches up to prediction.
                const decay = 1 - Math.exp(-SMOOTH_RATE * dt);
                smoothOffsetX *= (1 - decay);
                smoothOffsetY *= (1 - decay);
                smoothOffsetZ *= (1 - decay);

                // Final render position = interpolated predicted + smooth offset.
                localPos.x = interpX + smoothOffsetX;
                localPos.y = interpY + smoothOffsetY;
                localPos.z = interpZ + smoothOffsetZ;

                // --- UPDATE THIRD-PERSON CAMERA ---
                updateCamera(dt);

                // --- UPDATE TARGET BLOCK HIGHLIGHT ---
                const targetHit = (pointerLocked && !chatMode) ? getTargetBlock() : null;
                let targetPlayer = (pointerLocked && !chatMode) ? getTargetPlayer() : null;
                if (targetPlayer && targetHit && targetHit.distance < targetPlayer.hit.distance) {
                    targetPlayer = null;
                }
                if (targetHit && (!targetPlayer || targetHit.distance < targetPlayer.hit.distance)) {
                    highlightBox.position.set(
                        targetHit.object.userData.x,
                        targetHit.object.userData.y,
                        targetHit.object.userData.z
                    );
                    highlightBox.visible = true;
                } else {
                    highlightBox.visible = false;
                }
                if (targetPlayer) {
                    playerHighlight.position.copy(targetPlayer.player.mesh.position);
                    playerHighlight.rotation.copy(targetPlayer.player.mesh.rotation);
                    playerHighlight.visible = true;
                } else {
                    playerHighlight.visible = false;
                }

                // --- POSITION LOCAL CHAT SPRITE (follows player each frame) ---
                if (localChatSprite) {
                    const off = chatWorldOffset(CHAT_OFFSET_X, CHAT_OFFSET_Y, CHAT_OFFSET_Z, cameraYaw);
                    localChatSprite.position.set(
                        localPos.x + off.x,
                        localPos.y + off.y,
                        localPos.z + off.z
                    );
                }

                // --- ANIMATE RELEASED CHAT SPRITES ---
                for (let i = releasedChatSprites.length - 1; i >= 0; i--) {
                    const rc = releasedChatSprites[i];
                    rc.age += dt;
                    // Float upward.
                    rc.sprite.position.y += rc.floatSpeed * dt;
                    // Fade out after CHAT_FADE_START fraction of life.
                    const fadeStart = rc.maxAge * CHAT_FADE_START;
                    if (rc.age > fadeStart) {
                        const fadeProgress = (rc.age - fadeStart) / (rc.maxAge - fadeStart);
                        rc.sprite.material.opacity = Math.max(0, 1 - fadeProgress);
                    }
                    // Remove when fully faded.
                    if (rc.age >= rc.maxAge) {
                        scene.remove(rc.sprite);
                        rc.sprite.material.map.dispose();
                        rc.sprite.material.dispose();
                        releasedChatSprites.splice(i, 1);
                    }
                }

                // --- INTERPOLATE REMOTE PLAYERS ---
                // Remote players use snapshot interpolation, NOT local prediction.
                // targetPos is the capsule CENTER from server snapshots.
                for (const [, remote] of remotePlayers) {
                    const targetMeshY = remote.targetPos.y;
                    const rdx = remote.targetPos.x - remote.mesh.position.x;
                    const rdy = targetMeshY - remote.mesh.position.y;
                    const rdz = remote.targetPos.z - remote.mesh.position.z;
                    const dist = Math.hypot(rdx, rdy, rdz);

                    if (dist > 10) {
                        // Snap on huge jumps.
                        remote.mesh.position.set(remote.targetPos.x, targetMeshY, remote.targetPos.z);
                    } else if (dist > 0.01) {
                        const lerp = Math.min(1, 1 - Math.exp(-10 * dt));
                        remote.mesh.position.x += rdx * lerp;
                        remote.mesh.position.y += rdy * lerp;
                        remote.mesh.position.z += rdz * lerp;
                    }

                    // Smoothly rotate remote player to face their movement heading.
                    if (typeof remote.targetYaw === 'number') {
                        remote.mesh.rotation.y = remote.targetYaw;
                    }

                    // Update remote chat sprite position (follows the remote player).
                    if (remote.chatSprite) {
                        const rYaw = remote.targetYaw || 0;
                        const rOff = chatWorldOffset(CHAT_REMOTE_OFFSET_X, CHAT_REMOTE_OFFSET_Y, CHAT_REMOTE_OFFSET_Z, rYaw);
                        remote.chatSprite.position.set(
                            remote.mesh.position.x + rOff.x,
                            remote.mesh.position.y + rOff.y,
                            remote.mesh.position.z + rOff.z
                        );
                    }
                }

                // --- UPDATE HUD ---
                const hudCoords = document.getElementById('hud-coords');
                if (hudCoords) {
                    hudCoords.textContent =
                        `x: ${localPos.x.toFixed(1)} | y: ${localPos.y.toFixed(1)} | z: ${localPos.z.toFixed(1)}`;
                }

                renderer.render(scene, camera);
            }

            animate();

            // ================================================================
            // UTILITY
            // ================================================================

            function updateHudPlayers() {
                const total = remotePlayers.size + 1; // +1 for self
                const el = document.getElementById('hud-players');
                if (el) el.textContent = `Players: ${total}`;
            }

            // Handle window resize.
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            }); // end return new Promise((resolveGameReady) =>
        } // end startGame()
    </script>

</body>
