<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somewhere</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
            overflow: hidden;
        }

        /* ---- LOGIN SCREEN ---- */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 24px;
        }

        #login-screen h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            color: #7ecfff;
        }

        #login-screen p {
            color: #aaa;
            font-size: 1rem;
        }

        #google-login-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            background: #fff;
            color: #333;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        #google-login-btn:hover {
            background: #f0f0f0;
        }

        /* ---- GAME SCREEN ---- */
        #game-screen {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Crosshair in center of screen */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 24px;
            pointer-events: none;
            user-select: none;
            text-shadow: 1px 1px 2px #000;
            display: none;
        }

        /* HUD: player name top-left */
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            pointer-events: none;
        }

        #hud .coords {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 4px;
        }

        /* Block type selector */
        #block-selector {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .block-btn {
            width: 44px;
            height: 44px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .block-btn.active {
            border-color: #fff;
        }

        /* Chat hint */
        #chat-hint {
            position: absolute;
            bottom: 24px;
            right: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            pointer-events: none;
            user-select: none;
        }

        /* Pointer-lock click-to-play overlay */
        #click-to-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 20px 36px;
            border-radius: 10px;
            text-align: center;
            pointer-events: none;
        }

        #click-to-play h2 {
            margin-bottom: 8px;
        }

        #click-to-play p {
            font-size: 0.85rem;
            color: #aaa;
        }
    </style>
</head>

<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h1>Somewhere</h1>
        <p>A minimal multiplayer 3D block world</p>
        <a id="google-login-btn" href="/auth/google">
            <!-- Google logo SVG -->
            <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#EA4335"
                    d="M24 9.5c3.5 0 6.6 1.3 9 3.4l6.7-6.7C35.8 2.5 30.3 0 24 0 14.7 0 6.8 5.4 2.9 13.3l7.8 6C12.4 13 17.8 9.5 24 9.5z" />
                <path fill="#4285F4"
                    d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8C43.4 37.3 46.5 31.3 46.5 24.5z" />
                <path fill="#FBBC05"
                    d="M10.7 28.7A14.3 14.3 0 0 1 10 24c0-1.6.3-3.2.7-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.9 10.7l7.8-6z" />
                <path fill="#34A853"
                    d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.5-5.8c-2.1 1.4-4.7 2.2-8 2.2-6.2 0-11.5-4.2-13.3-9.9l-7.8 6C6.8 42.6 14.7 48 24 48z" />
            </svg>
            Continue with Google
        </a>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <canvas id="game-canvas"></canvas>

        <!-- Crosshair -->
        <div id="crosshair">+</div>

        <!-- Click-to-play hint (shown when pointer is not locked) -->
        <div id="click-to-play">
            <h2>Click to Play</h2>
            <p>Your mouse will be captured for camera control.<br>Press <strong>Escape</strong> to release.</p>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div>👤 <span id="hud-name">-</span></div>
            <div class="coords" id="hud-coords">x: 0 | y: 0 | z: 0</div>
            <div class="coords" id="hud-players">Players: 1</div>
        </div>

        <!-- Controls help (removed) -->

        <!-- Block type selector -->
        <div id="block-selector">
            <div class="block-btn active" data-type="dirt" style="background:#8B6914" title="Dirt">Dirt</div>
            <div class="block-btn" data-type="grass" style="background:#4a7c59" title="Grass">Grass</div>
            <div class="block-btn" data-type="stone" style="background:#888" title="Stone">Stone</div>
            <div class="block-btn" data-type="wood" style="background:#8B4513" title="Wood">Wood</div>
            <div class="block-btn" data-type="sand" style="background:#c2b280" title="Sand">Sand</div>
        </div>

        <!-- Chat hint -->
        <div id="chat-hint">Press "/" to chat</div>
    </div>

    <!-- Socket.IO client library (served by our server) -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Three.js from CDN using ES module importmap -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ================================================================
        // ⚙️  CONFIGURATION — Adjust these values to tweak behaviour
        // ================================================================

        // --- Camera (Third-Person Pivot-Orbit) ---
        const CAMERA_FOV = 60;              // Field of view (degrees)
        const CAMERA_PIVOT_HEIGHT = 1;    // Pivot point height above player feet (upper-chest level)
        const CAMERA_ARM_LENGTH = 4.25;      // Distance from pivot to camera (orbit radius)
        const CAMERA_SHOULDER_OFFSET = 1.5; // Horizontal offset to the right (over-the-shoulder)
        const CAMERA_PITCH_MIN = -1.0;      // Max look-down (radians, ~-57°)
        const CAMERA_PITCH_MAX = 0.8;       // Max look-up (radians, ~46°)
        const CAMERA_MIN_HEIGHT = 0.3;      // Minimum camera height above ground (avoid going underground)

        // --- Floating Chat Text ---
        const CHAT_MAX_LENGTH = 100;   // Max characters before auto-release
        const CHAT_OFFSET_X = 0.0;  // Text offset right of player (world units)
        const CHAT_OFFSET_Y = 0.1;  // Text offset above player pivot (world units)
        const CHAT_OFFSET_Z = 0.0;  // Text offset forward/back from player
        const CHAT_REMOTE_OFFSET_X = 0.0;  // Same offsets for remote players
        const CHAT_REMOTE_OFFSET_Y = 0.9;  // (higher because mesh anchor differs)
        const CHAT_REMOTE_OFFSET_Z = 0.0;
        const CHAT_SPRITE_HEIGHT = 0.5;  // Base height of a single text line (world units)
        const CHAT_FONT_SIZE = 48;   // Font size on the internal canvas (px)
        const CHAT_LINE_HEIGHT = 1.3;  // Line height multiplier (× font size)
        const CHAT_WRAP_WIDTH = 764;  // Max canvas width for word-wrap (px)
        const CHAT_OUTLINE_WIDTH = 6;    // Text outline stroke width (px)
        const CHAT_FLOAT_SPEED = 0.3;  // Released text float-up speed (units/s)
        const CHAT_FADE_DURATION = 4.0;  // Seconds before fully faded
        const CHAT_FADE_START = 0.4;  // Fraction of duration before fading begins

        // ================================================================
        // STEP 1: CHECK AUTH — show login or game screen
        // ================================================================

        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');

        let currentUser = null;

        const meRes = await fetch('/api/me');
        const meData = await meRes.json();

        if (!meData.loggedIn) {
            // Not logged in — the login screen is already visible.
        } else {
            // Logged in — hide login, show game.
            currentUser = meData.user;
            loginScreen.style.display = 'none';
            gameScreen.style.display = 'block';

            // Set HUD name
            document.getElementById('hud-name').textContent = currentUser.displayName;

            startGame(currentUser);
        }

        // ================================================================
        // STEP 2: THE GAME
        // ================================================================

        function startGame(user) {

            // ---- THREE.JS SCENE SETUP ----

            const canvas = document.getElementById('game-canvas');
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // sky blue
            scene.fog = new THREE.Fog(0x87ceeb, 30, 60);

            const camera = new THREE.PerspectiveCamera(CAMERA_FOV, window.innerWidth / window.innerHeight, 0.1, 100);

            // ---- LIGHTING ----

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(10, 20, 10);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 1024;
            sun.shadow.mapSize.height = 1024;
            scene.add(sun);

            // ================================================================
            // THIRD-PERSON CAMERA + CUSTOM MOUSE LOOK
            // ================================================================

            // Camera yaw/pitch controlled by mouse.
            let cameraYaw = 0;    // horizontal orbit angle (radians)
            let cameraPitch = -0.25; // vertical orbit angle (radians, slightly above horizontal)
            let pointerLocked = false;

            const clickToPlay = document.getElementById('click-to-play');
            const crosshair = document.getElementById('crosshair');

            // Safe helper to request pointer lock across all browsers
            function requestLock() {
                if (document.pointerLockElement === canvas) return;
                try {
                    const res = canvas.requestPointerLock();
                    if (res && typeof res.catch === 'function') {
                        res.catch((err) => {
                            console.warn('Pointer lock request rejected:', err);
                        });
                    }
                } catch (err) {
                    console.warn('Pointer lock error:', err);
                }
            }

            // Request pointer lock on click anywhere in the game (even in chat mode).
            window.addEventListener('click', (e) => {
                if (e.target && e.target.closest && e.target.closest('#block-selector')) return;
                requestLock();
            });

            // Programmatically exit pointer lock on Escape to avoid Chrome's
            // ~1.25s user-escape lockout on subsequent requestPointerLock() calls.
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && document.pointerLockElement) {
                    document.exitPointerLock();
                }
            }, true);

            document.addEventListener('pointerlockchange', () => {
                pointerLocked = (document.pointerLockElement === canvas);
                clickToPlay.style.display = pointerLocked ? 'none' : 'block';
                crosshair.style.display = pointerLocked ? 'block' : 'none';
            });

            // Mouse look: update yaw/pitch from mouse movement whenever pointer is locked.
            document.addEventListener('mousemove', (e) => {
                if (!pointerLocked) return;
                const sensitivity = 0.002;
                cameraYaw -= e.movementX * sensitivity;
                cameraPitch -= e.movementY * sensitivity;
                cameraPitch = Math.max(CAMERA_PITCH_MIN, Math.min(CAMERA_PITCH_MAX, cameraPitch));
            });

            // ---- LOCAL PLAYER MESH ----
            const localPlayerGeo = new THREE.BoxGeometry(0.6, 1.8, 0.6);
            const localPlayerMat = new THREE.MeshLambertMaterial({ color: 0x3a86ff }); // blue
            const localPlayerMesh = new THREE.Mesh(localPlayerGeo, localPlayerMat);
            localPlayerMesh.castShadow = true;
            scene.add(localPlayerMesh);

            // ================================================================
            // PIVOT-ORBIT THIRD-PERSON CAMERA
            // ================================================================
            //
            // How it works (like Fortnite / most 3rd-person games):
            //
            //   1. A PIVOT point sits at the player's upper-chest height.
            //   2. The camera ORBITS around this pivot using yaw (horizontal)
            //      and pitch (vertical).
            //   3. A SHOULDER OFFSET shifts the camera to the right so the
            //      player appears on the left side of the screen.
            //   4. The camera always looks at the pivot — this means:
            //      - Looking down → camera rises above the player.
            //      - Looking up   → camera drops toward the player's feet.
            //   5. The player mesh rotates to match the camera yaw, keeping
            //      movement and camera direction synchronised.
            //
            // Three.js convention: rotation.y = 0 faces -Z.
            //   Forward = (-sinY, 0, -cosY)
            //   Right   = ( cosY, 0, -sinY)
            //   Behind  = ( sinY, 0,  cosY)

            function updateCamera() {
                // ---- Player mesh ----
                // Player feet are at localPos.y - 0.9 (half the 1.8-tall box).
                const feetY = localPos.y - 0.9;
                localPlayerMesh.position.set(localPos.x, feetY, localPos.z);
                localPlayerMesh.rotation.y = cameraYaw;

                // ---- Pivot point (upper chest) ----
                const pivotX = localPos.x;
                const pivotY = feetY + CAMERA_PIVOT_HEIGHT;
                const pivotZ = localPos.z;

                // ---- Orbit position ----
                // The camera orbits around the pivot at CAMERA_ARM_LENGTH distance.
                // pitch=0 → camera is level with pivot, behind the player.
                // pitch<0 → camera rises above (looking down at player).
                // pitch>0 → camera drops below (looking up past player).
                const sinY = Math.sin(cameraYaw);
                const cosY = Math.cos(cameraYaw);
                const cosP = Math.cos(cameraPitch);
                const sinP = Math.sin(cameraPitch);

                // Orbit offset in world space (behind and vertically orbiting).
                // "Behind" direction (XZ, rotated by yaw): (sinY, cosY)
                // Vertical component from pitch: arm * sinP goes up/down.
                // Horizontal component from pitch: arm * cosP gives the XZ distance.
                const armXZ = CAMERA_ARM_LENGTH * cosP;  // horizontal distance from pivot
                const armY = -CAMERA_ARM_LENGTH * sinP;  // vertical offset (pitch<0 → armY>0 → above)

                let camX = pivotX + sinY * armXZ;
                let camY = pivotY + armY;
                let camZ = pivotZ + cosY * armXZ;

                // ---- Shoulder offset (applied in world-right direction) ----
                // This shifts the camera to the right WITHOUT changing where it
                // looks, so the player appears on the left of the screen.
                camX += cosY * CAMERA_SHOULDER_OFFSET;
                camZ -= sinY * CAMERA_SHOULDER_OFFSET;

                // ---- Clamp camera height above ground ----
                if (camY < CAMERA_MIN_HEIGHT) camY = CAMERA_MIN_HEIGHT;

                camera.position.set(camX, camY, camZ);

                // ---- Look FORWARD (not at the player) ----
                // The camera looks in the player's forward direction with pitch
                // applied. This keeps camera and player yaw synchronised and
                // prevents the shoulder offset from introducing an unwanted angle.
                const lookDist = 50;
                const fwdX = -sinY * cosP;  // forward direction with pitch
                const fwdY = sinP;
                const fwdZ = -cosY * cosP;
                camera.lookAt(camX + fwdX * lookDist, camY + fwdY * lookDist, camZ + fwdZ * lookDist);
            }

            // ================================================================
            // BLOCK MANAGEMENT (CLIENT SIDE)
            // ================================================================

            // Block colors by type.
            const BLOCK_COLORS = {
                dirt: 0x8B6914,
                grass: 0x4a7c59,
                stone: 0x888888,
                wood: 0x8B4513,
                sand: 0xc2b280,
            };

            // Map "x,y,z" -> THREE.Mesh
            const blockMeshes = new Map();

            // Shared geometry for all blocks (1x1x1 cube).
            const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
            // We create a unique material per color (5 total — small, fine).
            const blockMaterials = {};
            for (const [type, color] of Object.entries(BLOCK_COLORS)) {
                blockMaterials[type] = new THREE.MeshLambertMaterial({ color });
            }

            function blockKey(x, y, z) {
                return `${x},${y},${z}`;
            }

            function addBlock(x, y, z, type) {
                const k = blockKey(x, y, z);
                if (blockMeshes.has(k)) return; // already rendered

                const mat = blockMaterials[type] || blockMaterials.dirt;
                const mesh = new THREE.Mesh(blockGeometry, mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                // Store coordinates on the mesh so the raycaster can read them.
                mesh.userData = { x, y, z, type };
                scene.add(mesh);
                blockMeshes.set(k, mesh);
            }

            function deleteBlock(x, y, z) {
                const k = blockKey(x, y, z);
                const mesh = blockMeshes.get(k);
                if (mesh) {
                    scene.remove(mesh);
                    blockMeshes.delete(k);
                }
            }

            // ================================================================
            // REMOTE PLAYER MESHES
            // ================================================================

            // Map: socketId -> { mesh, targetPos, name, chatSprite }
            const remotePlayers = new Map();

            const remoteGeometry = new THREE.BoxGeometry(0.6, 1.8, 0.6);
            const remoteMaterial = new THREE.MeshLambertMaterial({ color: 0xff6b35 });

            function addRemotePlayer(playerData) {
                if (remotePlayers.has(playerData.id)) return;
                const mesh = new THREE.Mesh(remoteGeometry, remoteMaterial);
                mesh.position.set(
                    playerData.position.x,
                    playerData.position.y - 0.9, // anchor feet to ground
                    playerData.position.z
                );
                mesh.castShadow = true;
                scene.add(mesh);
                remotePlayers.set(playerData.id, {
                    mesh,
                    targetPos: { ...playerData.position },
                    name: playerData.name,
                    chatSprite: null,
                });
            }

            function removeRemotePlayer(socketId) {
                const data = remotePlayers.get(socketId);
                if (data) {
                    scene.remove(data.mesh);
                    if (data.chatSprite) scene.remove(data.chatSprite);
                    remotePlayers.delete(socketId);
                }
            }

            // ================================================================
            // SOCKET.IO
            // ================================================================

            const socket = io();

            let mySocketId = null;

            // --- Welcome ---
            socket.on('welcome', (data) => {
                mySocketId = socket.id;
                // Snap to server-authoritative position.
                localPos.x = data.player.position.x;
                localPos.y = data.player.position.y;
                localPos.z = data.player.position.z;
                serverPos.x = data.player.position.x;
                serverPos.y = data.player.position.y;
                serverPos.z = data.player.position.z;
                console.log('Welcome!', data.player.name, 'at', data.player.position);
                updateHudPlayers();
            });

            // --- Initial world blocks ---
            socket.on('world_state', (data) => {
                for (const b of data.blocks) {
                    addBlock(b.x, b.y, b.z, b.type);
                }
                console.log(`Loaded ${data.blocks.length} blocks.`);
            });

            // --- Other players already in world ---
            socket.on('players_state', (data) => {
                for (const p of data.players) {
                    addRemotePlayer(p);
                }
                updateHudPlayers();
            });

            // --- Someone joins ---
            socket.on('player_joined', (player) => {
                addRemotePlayer(player);
                updateHudPlayers();
            });

            // --- Someone leaves ---
            socket.on('player_left', (data) => {
                removeRemotePlayer(data.playerId);
                updateHudPlayers();
            });

            // --- Movement snapshots (20 per second) ---
            socket.on('movement_snapshot', (data) => {
                for (const update of data.players) {
                    if (update.id === mySocketId) {
                        // Reconcile server position with our local prediction.
                        serverPos.x = update.position.x;
                        serverPos.y = update.position.y;
                        serverPos.z = update.position.z;
                    } else {
                        const remote = remotePlayers.get(update.id);
                        if (remote) {
                            remote.targetPos.x = update.position.x;
                            remote.targetPos.y = update.position.y - 0.9;
                            remote.targetPos.z = update.position.z;
                            if (typeof update.yaw === 'number') {
                                remote.targetYaw = update.yaw;
                            }
                        }
                    }
                }
            });

            // --- Block events ---
            socket.on('block:placed', (data) => {
                addBlock(data.x, data.y, data.z, data.type);
            });

            socket.on('block:removed', (data) => {
                deleteBlock(data.x, data.y, data.z);
            });

            // --- Rejected actions ---
            socket.on('request_rejected', (data) => {
                console.warn(`[Rejected] ${data.action}: ${data.reason}`);
            });

            // --- Chat (floating text from other players) ---
            socket.on('chat:message', (data) => {
                if (data.playerId === mySocketId) return; // we already show our own
                const remote = remotePlayers.get(data.playerId);
                if (!remote) return;
                // Create a floating released chat sprite at the remote player's head.
                createReleasedChatSprite(
                    data.message,
                    remote.mesh.position.x,
                    remote.mesh.position.y + 1.3,
                    remote.mesh.position.z
                );
            });

            // ================================================================
            // MOVEMENT INPUT
            // ================================================================

            const keys = { w: false, a: false, s: false, d: false };
            let lastSentInput = { forward: 0, strafe: 0, yaw: 0 };

            // The server-authoritative position for reconciliation.
            const serverPos = {
                x: user.position.x,
                y: user.position.y,
                z: user.position.z,
            };

            // ---- CHAT MODE ----
            // When chatMode is true, all alphabet/gameplay keys are disabled.
            let chatMode = false;
            let chatText = '';

            window.addEventListener('keydown', (e) => {
                // --- CHAT MODE INPUT ---
                if (chatMode) {
                    e.preventDefault();
                    if (e.key === 'Escape') {
                        // Cancel chat.
                        chatText = '';
                        chatMode = false;
                        updateLocalChatSprite();
                        return;
                    }
                    if (e.key === 'Enter') {
                        // Release the chat message.
                        releaseChat();
                        return;
                    }
                    if (e.key === 'Backspace') {
                        chatText = chatText.slice(0, -1);
                        updateLocalChatSprite();
                        // Send typing update to server for real-time display.
                        socket.emit('chat:typing', { text: chatText });
                        return;
                    }
                    // Only accept printable single characters.
                    if (e.key.length === 1) {
                        if (chatText.length < CHAT_MAX_LENGTH) {
                            chatText += e.key;
                            updateLocalChatSprite();
                            socket.emit('chat:typing', { text: chatText });
                        }
                        // Auto-release if at max length (stay in chat mode).
                        if (chatText.length >= CHAT_MAX_LENGTH) {
                            releaseChat(false);
                        }
                    }
                    return; // Block everything else while chatting.
                }

                // --- NORMAL GAMEPLAY INPUT ---
                // Enter chat mode with "/" key.
                if (e.key === '/') {
                    e.preventDefault();
                    chatMode = true;
                    chatText = '';
                    // Clear any held movement keys so the player decelerates
                    // naturally through the existing movement logic.
                    keys.w = false; keys.a = false; keys.s = false; keys.d = false;
                    // Immediately send zero input to the server so it also
                    // stops accelerating this player.
                    sendMovementInput();
                    updateLocalChatSprite();
                    return;
                }

                const k = e.key.toLowerCase();
                if (k in keys) { keys[k] = true; e.preventDefault(); }
            });

            window.addEventListener('keyup', (e) => {
                if (chatMode) return; // ignore key-ups during chat
                const k = e.key.toLowerCase();
                if (k in keys) keys[k] = false;
            });

            function getCameraYaw() {
                return cameraYaw;
            }

            function sendMovementInput() {
                if (!socket.connected) return;

                const forward = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
                const strafe = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
                const yaw = getCameraYaw();

                // Only send if something changed (don't spam the server).
                if (
                    forward !== lastSentInput.forward ||
                    strafe !== lastSentInput.strafe ||
                    Math.abs(yaw - lastSentInput.yaw) > 0.01
                ) {
                    lastSentInput = { forward, strafe, yaw };
                    socket.emit('movement_input', { forward, strafe, yaw });
                }
            }

            // Send movement input every 50ms (20 times per second).
            setInterval(sendMovementInput, 50);

            // ================================================================
            // FLOATING CHAT SYSTEM (THREE.JS SPRITES)
            // ================================================================

            // Local player's typing sprite (visible while typing).
            let localChatSprite = null;

            // Array of released (floating-up, fading) chat sprites.
            const releasedChatSprites = [];

            // Rotate a local-space (right, up, forward) offset by a yaw angle
            // into world-space coordinates.  This keeps the text anchored to
            // the player's right/front side regardless of facing direction.
            //
            // Three.js convention (rotation.y = 0 → faces -Z):
            //   Right   = ( cosY, 0, -sinY)
            //   Forward = (-sinY, 0, -cosY)
            function chatWorldOffset(rightOff, upOff, fwdOff, yaw) {
                const sinY = Math.sin(yaw);
                const cosY = Math.cos(yaw);
                return {
                    x: cosY * rightOff + (-sinY) * fwdOff,
                    y: upOff,
                    z: -sinY * rightOff + (-cosY) * fwdOff,
                };
            }

            // Creates an outlined text sprite with word wrapping.
            // Uses the CHAT_* config constants for sizing.
            function createTextSprite(text, maxWidth) {
                const cnv = document.createElement('canvas');
                const ctx = cnv.getContext('2d');
                const fontSize = CHAT_FONT_SIZE;
                const lineHeight = fontSize * CHAT_LINE_HEIGHT;
                const padding = 16;
                const maxCanvasWidth = maxWidth || CHAT_WRAP_WIDTH;

                ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;

                const maxTextWidth = maxCanvasWidth - padding * 2;

                // Break a single word that's too wide by inserting hyphens.
                function breakLongWord(word) {
                    const parts = [];
                    while (ctx.measureText(word).width > maxTextWidth) {
                        // Find how many chars fit with a trailing '-'.
                        let cut = word.length;
                        while (cut > 1 && ctx.measureText(word.slice(0, cut) + '-').width > maxTextWidth) {
                            cut--;
                        }
                        parts.push(word.slice(0, cut) + '-');
                        word = word.slice(cut);
                    }
                    if (word) parts.push(word);
                    return parts;
                }

                // Word-wrap the text, breaking long words with hyphens.
                const words = (text || ' ').split(' ');
                const lines = [];
                let currentLine = '';

                for (const word of words) {
                    // If the single word is wider than the max, break it.
                    const wordParts = ctx.measureText(word).width > maxTextWidth
                        ? breakLongWord(word)
                        : [word];

                    for (const part of wordParts) {
                        const testLine = currentLine ? currentLine + ' ' + part : part;
                        if (ctx.measureText(testLine).width > maxTextWidth && currentLine) {
                            lines.push(currentLine);
                            currentLine = part;
                        } else {
                            currentLine = testLine;
                        }
                    }
                }
                if (currentLine) lines.push(currentLine);
                if (lines.length === 0) lines.push(' ');

                // Find the widest line to size the canvas.
                let widestLine = 0;
                for (const line of lines) {
                    const w = ctx.measureText(line).width;
                    if (w > widestLine) widestLine = w;
                }

                cnv.width = Math.min(widestLine + padding * 2, maxCanvasWidth);
                cnv.height = lineHeight * lines.length + padding * 2;

                // Re-set font after canvas resize.
                ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
                ctx.textBaseline = 'middle';
                ctx.textAlign = 'center';

                const cx = cnv.width / 2;

                // Draw each line.
                for (let i = 0; i < lines.length; i++) {
                    const cy = padding + lineHeight * (i + 0.5);
                    ctx.lineWidth = CHAT_OUTLINE_WIDTH;
                    ctx.strokeStyle = '#000';
                    ctx.strokeText(lines[i], cx, cy);
                    ctx.fillStyle = '#fff';
                    ctx.fillText(lines[i], cx, cy);
                }

                const texture = new THREE.CanvasTexture(cnv);
                texture.needsUpdate = true;

                const spriteMat = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    depthTest: false,
                });
                const sprite = new THREE.Sprite(spriteMat);

                // Anchor at bottom-center so text grows upward from the offset point.
                sprite.center.set(0.5, 0);

                // Scale to reasonable world size.
                const aspect = cnv.width / cnv.height;
                const height = CHAT_SPRITE_HEIGHT * lines.length;
                sprite.scale.set(height * aspect, height, 1);

                return sprite;
            }

            function updateLocalChatSprite() {
                // Remove old sprite.
                if (localChatSprite) {
                    scene.remove(localChatSprite);
                    localChatSprite.material.map.dispose();
                    localChatSprite.material.dispose();
                    localChatSprite = null;
                }

                if (!chatMode || chatText.length === 0) return;

                localChatSprite = createTextSprite(chatText, CHAT_WRAP_WIDTH);
                scene.add(localChatSprite);
                // Position will be updated each frame in animate().
            }

            function createReleasedChatSprite(text, worldX, worldY, worldZ) {
                if (!text || text.trim().length === 0) return;
                const sprite = createTextSprite(text, CHAT_WRAP_WIDTH);
                sprite.position.set(worldX, worldY, worldZ);
                scene.add(sprite);
                releasedChatSprites.push({
                    sprite,
                    age: 0,
                    maxAge: CHAT_FADE_DURATION,
                    floatSpeed: CHAT_FLOAT_SPEED,
                });
            }

            function releaseChat(exitChatMode = true) {
                if (chatText.trim().length > 0) {
                    // Send chat message to server.
                    socket.emit('chat:message', { message: chatText.trim() });

                    // Release from the player's current position using the
                    // same yaw-rotated offset the animate loop uses, so there
                    // is zero positional jump.
                    const off = chatWorldOffset(CHAT_OFFSET_X, CHAT_OFFSET_Y, CHAT_OFFSET_Z, cameraYaw);
                    const releaseX = localPos.x + off.x;
                    const releaseY = localPos.y + off.y;
                    const releaseZ = localPos.z + off.z;

                    createReleasedChatSprite(chatText.trim(), releaseX, releaseY, releaseZ);
                }
                chatText = '';
                if (exitChatMode) chatMode = false;
                // Remove typing sprite.
                if (localChatSprite) {
                    scene.remove(localChatSprite);
                    localChatSprite.material.map.dispose();
                    localChatSprite.material.dispose();
                    localChatSprite = null;
                }
            }

            // Handle real-time typing from remote players.
            socket.on('chat:typing', (data) => {
                const remote = remotePlayers.get(data.playerId);
                if (!remote) return;
                // Remove old typing sprite.
                if (remote.chatSprite) {
                    scene.remove(remote.chatSprite);
                    remote.chatSprite.material.map.dispose();
                    remote.chatSprite.material.dispose();
                    remote.chatSprite = null;
                }
                if (data.text && data.text.length > 0) {
                    remote.chatSprite = createTextSprite(data.text, CHAT_WRAP_WIDTH);
                    // Initial position (updated each frame in animate loop).
                    const rYaw = remote.targetYaw || 0;
                    const rOff = chatWorldOffset(CHAT_REMOTE_OFFSET_X, CHAT_REMOTE_OFFSET_Y, CHAT_REMOTE_OFFSET_Z, rYaw);
                    remote.chatSprite.position.set(
                        remote.mesh.position.x + rOff.x,
                        remote.mesh.position.y + rOff.y,
                        remote.mesh.position.z + rOff.z
                    );
                    scene.add(remote.chatSprite);
                }
            });

            // ================================================================
            // BLOCK INTERACTION (RAYCASTING)
            // ================================================================

            const raycaster = new THREE.Raycaster();
            raycaster.far = 6; // Can only reach blocks within 6 units.

            let selectedBlockType = 'dirt';

            // Block type selector buttons.
            document.querySelectorAll('.block-btn').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.block-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedBlockType = btn.dataset.type;
                });
            });

            // Cast a ray from camera center and find the closest block.
            function getTargetBlock() {
                // Ray from center of screen.
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

                const meshArray = Array.from(blockMeshes.values());
                const intersects = raycaster.intersectObjects(meshArray);

                if (intersects.length === 0) return null;

                return intersects[0]; // closest hit
            }

            // Left-click: remove the block you're looking at.
            document.addEventListener('mousedown', (e) => {
                if (!pointerLocked || chatMode) return;
                if (e.button !== 0) return; // only left button

                const hit = getTargetBlock();
                if (!hit) return;

                const { x, y, z } = hit.object.userData;
                socket.emit('block:remove', { x, y, z });
                // Optimistic local removal (server confirms/corrects).
                deleteBlock(x, y, z);
            });

            // Right-click: place a block adjacent to the face you're looking at.
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (!pointerLocked || chatMode) return;

                const hit = getTargetBlock();
                if (!hit) return;

                // The face normal tells us WHICH face we're pointing at.
                const normal = hit.face.normal.clone();
                normal.transformDirection(hit.object.matrixWorld);

                const { x, y, z } = hit.object.userData;
                const nx = Math.round(x + normal.x);
                const ny = Math.round(y + normal.y);
                const nz = Math.round(z + normal.z);

                // Don't place a block inside the player.
                if (Math.abs(localPos.x - nx) < 0.6 &&
                    Math.abs(localPos.y - ny) < 1.2 &&
                    Math.abs(localPos.z - nz) < 0.6) {
                    return;
                }

                socket.emit('block:place', { x: nx, y: ny, z: nz, type: selectedBlockType });
                // Optimistic local add.
                addBlock(nx, ny, nz, selectedBlockType);
            });

            // ================================================================
            // RENDER LOOP
            // ================================================================

            const clock = new THREE.Clock();

            // Local position prediction (what we display while waiting for server).
            const localPos = {
                x: user.position.x,
                y: user.position.y,
                z: user.position.z,
            };

            function animate() {
                requestAnimationFrame(animate);

                const dt = clock.getDelta();

                // --- LOCAL PREDICTION ---
                // We predict movement locally so the game feels instant.
                // The server position is used to correct drift.
                if (pointerLocked) {
                    const speed = 8;
                    const forward = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
                    const strafe = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);

                    if (forward !== 0 || strafe !== 0) {
                        // Use the LAST SENT yaw (same value the server uses)
                        // so client prediction matches server exactly.
                        const yaw = lastSentInput.yaw;
                        const sinYaw = Math.sin(yaw);
                        const cosYaw = Math.cos(yaw);

                        let dx = -sinYaw * forward + cosYaw * strafe;
                        let dz = -cosYaw * forward - sinYaw * strafe;

                        const mag = Math.hypot(dx, dz);
                        if (mag > 1) { dx /= mag; dz /= mag; }

                        localPos.x += dx * speed * dt;
                        localPos.z += dz * speed * dt;

                        // Clamp to world bounds.
                        localPos.x = Math.max(-30, Math.min(30, localPos.x));
                        localPos.z = Math.max(-30, Math.min(30, localPos.z));
                    }

                    // Server reconciliation: smoothly correct toward server position.
                    const errX = serverPos.x - localPos.x;
                    const errZ = serverPos.z - localPos.z;
                    const dist = Math.hypot(errX, errZ);
                    if (dist > 10) {
                        // Big drift → snap.
                        localPos.x = serverPos.x;
                        localPos.z = serverPos.z;
                    } else if (dist > 0.1) {
                        // Small drift → gently pull.
                        localPos.x += errX * Math.min(1, 5 * dt);
                        localPos.z += errZ * Math.min(1, 5 * dt);
                    }
                }

                // --- UPDATE THIRD-PERSON CAMERA ---
                updateCamera();

                // --- POSITION LOCAL CHAT SPRITE (follows player each frame) ---
                if (localChatSprite) {
                    const off = chatWorldOffset(CHAT_OFFSET_X, CHAT_OFFSET_Y, CHAT_OFFSET_Z, cameraYaw);
                    localChatSprite.position.set(
                        localPos.x + off.x,
                        localPos.y + off.y,
                        localPos.z + off.z
                    );
                }

                // --- ANIMATE RELEASED CHAT SPRITES ---
                for (let i = releasedChatSprites.length - 1; i >= 0; i--) {
                    const rc = releasedChatSprites[i];
                    rc.age += dt;
                    // Float upward.
                    rc.sprite.position.y += rc.floatSpeed * dt;
                    // Fade out after CHAT_FADE_START fraction of life.
                    const fadeStart = rc.maxAge * CHAT_FADE_START;
                    if (rc.age > fadeStart) {
                        const fadeProgress = (rc.age - fadeStart) / (rc.maxAge - fadeStart);
                        rc.sprite.material.opacity = Math.max(0, 1 - fadeProgress);
                    }
                    // Remove when fully faded.
                    if (rc.age >= rc.maxAge) {
                        scene.remove(rc.sprite);
                        rc.sprite.material.map.dispose();
                        rc.sprite.material.dispose();
                        releasedChatSprites.splice(i, 1);
                    }
                }

                // --- INTERPOLATE REMOTE PLAYERS ---
                for (const [, remote] of remotePlayers) {
                    const rdx = remote.targetPos.x - remote.mesh.position.x;
                    const rdy = remote.targetPos.y - remote.mesh.position.y;
                    const rdz = remote.targetPos.z - remote.mesh.position.z;
                    const dist = Math.hypot(rdx, rdy, rdz);

                    if (dist > 10) {
                        // Snap on huge jumps.
                        remote.mesh.position.set(remote.targetPos.x, remote.targetPos.y, remote.targetPos.z);
                    } else if (dist > 0.01) {
                        const lerp = Math.min(1, 1 - Math.exp(-10 * dt));
                        remote.mesh.position.x += rdx * lerp;
                        remote.mesh.position.y += rdy * lerp;
                        remote.mesh.position.z += rdz * lerp;
                    }

                    // Smoothly rotate remote player to face their movement heading.
                    if (typeof remote.targetYaw === 'number') {
                        remote.mesh.rotation.y = remote.targetYaw;
                    }

                    // Update remote chat sprite position (follows the remote player).
                    if (remote.chatSprite) {
                        const rYaw = remote.targetYaw || 0;
                        const rOff = chatWorldOffset(CHAT_REMOTE_OFFSET_X, CHAT_REMOTE_OFFSET_Y, CHAT_REMOTE_OFFSET_Z, rYaw);
                        remote.chatSprite.position.set(
                            remote.mesh.position.x + rOff.x,
                            remote.mesh.position.y + rOff.y,
                            remote.mesh.position.z + rOff.z
                        );
                    }
                }

                // --- UPDATE HUD COORDS ---
                document.getElementById('hud-coords').textContent =
                    `x: ${localPos.x.toFixed(1)} | y: ${localPos.y.toFixed(1)} | z: ${localPos.z.toFixed(1)}`;

                renderer.render(scene, camera);
            }

            animate();

            // ================================================================
            // UTILITY
            // ================================================================

            function updateHudPlayers() {
                const total = remotePlayers.size + 1; // +1 for self
                document.getElementById('hud-players').textContent = `Players: ${total}`;
            }

            // Handle window resize.
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

        } // end startGame()
    </script>

</body>
